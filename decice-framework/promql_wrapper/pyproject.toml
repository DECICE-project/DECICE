[project]
name = "prom-json-wrapper"
version = "0.3.5"
description = "desc"
authors = [
  { name = "Your Name", email = "you@example.com" }
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
  "aiopromql==0.1.2",
  "fastapi[all]>=0.115.9,<0.116.0",
  "prometheus-client (>=0.23.1,<0.24.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
isort = "^6.0.1"
ruff = "^0.9.9"
pytest = "^8.4.2"
coverage = "^7.10.7"
pytest-asyncio = "^1.2.0"

[tool.pytest.ini_options]
pythonpath = "src"
filterwarnings = "ignore::DeprecationWarning"

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "tests/*",
    "*/__init__.py",
    "main.py",
    "abstract_client.py"
]