# A minimal, modern, and correct Loki configuration for a single-instance, filesystem-backed deployment
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  
  # For a single-node setup
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

# Use  TSDB index store
schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Use the 'filesystem' for object storage
storage_config:
  filesystem:
    directory: /loki/chunks

# NOTE: For this simple setup, 'compactor', 'ruler', and 'limits_config' are
# not required. Loki will use defaults.