apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configMap.name }}
  namespace: {{ .Values.namespace }}
data:
  SCHEDULER_PORT: "{{ .Values.env.aiSchedulerPort }}"
  SCHEDULER_HOST: {{ .Values.env.aiSchedulerHost }}
  SC_PORT: "{{ .Values.env.schedulerControllerPort }}"
  SC_SERVICE: {{ .Values.env.schedulerControllerService }}