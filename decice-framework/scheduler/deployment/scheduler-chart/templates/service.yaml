apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  namespace: {{ .Values.namespace}}
spec:
  selector:
    app: {{ .Values.applicationName }} 
  ports:
  - protocol: TCP
    port: {{ .Values.service.servicePort }}
    targetPort: {{ .Values.service.servicePort }}
  type: {{ .Values.service.type }}