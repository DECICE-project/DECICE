apiVersion: v1
kind: ConfigMap
metadata:
  name: volcano-scheduler-configmap
  namespace: volcano-system
data:
  volcano-scheduler.conf: |
    actions: "enqueue, allocate, backfill"
    tiers:
    - plugins:
      - name: priority
      - name: gang
        enablePreemptable: false
      - name: conformance
    - plugins:
      - name: overcommit
      - name: drf
        enablePreemptable: false
      - name: predicates
      - name: proportion
      - name: nodeorder
      - name: binpack
    # Enable metrics collection with correct format for v1.9.0
    metrics:
      type: "prometheus"
      address: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
---
apiVersion: v1
kind: Service
metadata:
  name: volcano-scheduler-metrics
  namespace: volcano-system
  labels:
    app: volcano-scheduler
    component: metrics
spec:
  selector:
    app: volcano-scheduler
  ports:
  - port: 8080
    targetPort: 8080
    name: metrics
  type: ClusterIP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: volcano-scheduler
  namespace: volcano-system
  labels:
    app: volcano-scheduler
    release: prometheus
spec:
  selector:
    matchLabels:
      app: volcano-scheduler
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
---
apiVersion: v1
kind: Service
metadata:
  name: volcano-controllers-metrics
  namespace: volcano-system
  labels:
    app: volcano-controllers
    component: metrics
spec:
  selector:
    app: volcano-controllers
  ports:
  - port: 8080
    targetPort: 8080
    name: metrics
  type: ClusterIP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: volcano-controllers
  namespace: volcano-system
  labels:
    app: volcano-controllers
    release: prometheus
spec:
  selector:
    matchLabels:
      app: volcano-controllers
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
