  - name: simple-ml-pipeline
    dag:
      tasks:
      - {name: create-dataset, template: create-dataset}
      - name: preprocess-data
        template: preprocess-data
        dependencies: [create-dataset]
      - name: run-inference
        template: run-inference
        dependencies: [train-model]
      - name: train-model
        template: train-model
        dependencies: [preprocess-data]
  - name: train-model
    container:
      args: []
      command:
      - sh
      - -c
      - (PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet --no-warn-script-location
        'tensorflow' 'mlflow' 'numpy' || PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m
        pip install --quiet --no-warn-script-location 'tensorflow' 'mlflow' 'numpy'
        --user) && "$0" "$@"
      - sh
      - -ec
      - |
        program_path=$(mktemp)
        printf "%s" "$0" > "$program_path"
        python3 -u "$program_path" "$@"
      - |
        def train_model():
            """
            Put your model training code here.
            This function trains a model using the preprocessed dataset.
            Set paths for saving the model and logs.
            """
            import os
            import tensorflow as tf
            import mlflow
            import numpy as np
            processed_data_path = "/mnt/shared/processed_data"  # Modify this path if needed
            model_path = "/mnt/shared/model"  # Modify this path if needed
            log_dir = "/mnt/shared/logs"  # Modify this path if needed

            mlflow.start_run()
            data = np.load(os.path.join(processed_data_path, 'processed_dataset.npy'))
            x, y = data[:, 0], data[:, 1]

            model = tf.keras.Sequential([
                tf.keras.layers.Dense(1, input_shape=[1])
            ])
            model.compile(optimizer='adam', loss='mse')

            tensorboard_callback = tf.keras.callbacks.TensorBoard(log_dir=log_dir)
            model.fit(x, y, epochs=5, verbose=2, callbacks=[tensorboard_callback])

            os.makedirs(model_path, exist_ok=True)
            model.save(os.path.join(model_path, 'simple_model.h5'))

            mlflow.log_param("epochs", 5)
            mlflow.log_artifact(os.path.join(model_path, 'simple_model.h5'))
            mlflow.end_run()

        import argparse
        _parser = argparse.ArgumentParser(prog='Train model', description='Put your model training code here.')
        _parsed_args = vars(_parser.parse_args())

        _outputs = train_model(**_parsed_args)
      image: python:3.7
      volumeMounts:
      - {mountPath: /mnt/shared, name: shared-volume}
